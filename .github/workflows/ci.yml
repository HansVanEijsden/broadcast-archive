name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Parser tests
        run: php tests/run.php

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node --check assets/js/broadcast-archive.js
